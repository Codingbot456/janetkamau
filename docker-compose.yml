services:
  frontend-blue:
    build:
      context: ./front
      dockerfile: Dockerfile2
    image: janet-frontend:blue
    container_name: janet-frontend-blue
    ports:
      - "3151:3000"
    env_file:
      - ./front/.env
    restart: unless-stopped

  frontend-green:
    build:
      context: ./front
      dockerfile: Dockerfile2
    image: janet-frontend:green
    container_name: janet-frontend-green
    ports:
      - "3152:3000"
    env_file:
      - ./front/.env
    restart: unless-stopped